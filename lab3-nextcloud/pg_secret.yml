# Логин и пароль PostgreSQL. Раньше лежали в ConfigMap открытым текстом.
# stringData удобно писать руками, Kubernetes сам закодирует значения в base64.
apiVersion: v1
kind: Secret
metadata:
  name: postgres-secret
  labels:
    app: postgres
type: Opaque
stringData:
  POSTGRES_USER: "postgres"
  POSTGRES_PASSWORD: "lab3-pg-password"
