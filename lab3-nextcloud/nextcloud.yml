apiVersion: v1
kind: Secret
metadata:
  name: nextcloud-secret
  labels:
    app: nextcloud
type: Opaque
stringData:
  # Доступ к БД задаётся для Nextcloud отдельно от Secret контейнера PostgreSQL.
  NEXTCLOUD_ADMIN_PASSWORD: "lab3-admin-password"
  POSTGRES_USER: "postgres"
  POSTGRES_PASSWORD: "lab3-pg-password"
---
# Несекретные переменные только Nextcloud
apiVersion: v1
kind: ConfigMap
metadata:
  name: nextcloud-configmap
  labels:
    app: nextcloud
data:
  NEXTCLOUD_UPDATE: "1"
  ALLOW_EMPTY_PASSWORD: "yes"
  POSTGRES_HOST: "postgres-service"
  POSTGRES_DB: "postgres"
  NEXTCLOUD_TRUSTED_DOMAINS: "127.0.0.1"
  NEXTCLOUD_ADMIN_USER: "labadmin"
---
kind: Deployment
apiVersion: apps/v1
metadata:
  name: nextcloud
  labels:
    app: nextcloud
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nextcloud
  template:
    metadata:
      labels:
        app: nextcloud
    spec:
      containers:
      - name: nextcloud
        image: docker.io/nextcloud:stable-apache
        # Изменено: с лимитом 256Mi из методички под убивало OOMKilled
        # при первом же входе через браузер. Замеры памяти — в отчёте.
        resources:
          limits:
            cpu: 500m
            memory: 512Mi
          requests:
            cpu: 250m
            memory: 256Mi
        ports:
        - name: http
          containerPort: 80
          protocol: TCP
        envFrom:
        - configMapRef:
            name: nextcloud-configmap
        - secretRef:
            name: nextcloud-secret
        # Новое: пробы.
        # startupProbe даёт до 10 минут на первую установку. Пока она не прошла,
        # liveness и readiness не запускаются и не убьют под посреди установки.
        startupProbe:
          httpGet:
            path: /status.php
            port: http
            httpHeaders:
            - name: Host
              value: "127.0.0.1"   # Nextcloud отвечает только доверенным доменам
          periodSeconds: 10
          failureThreshold: 60
        # readiness: Nextcloud (PHP + конфиг) отвечает — можно слать трафик
        readinessProbe:
          httpGet:
            path: /status.php
            port: http
            httpHeaders:
            - name: Host
              value: "127.0.0.1"
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        # liveness: жив ли сам Apache. Статический файл не зависит от PHP и базы,
        # поэтому падение Postgres не приведёт к бессмысленным перезапускам Nextcloud.
        livenessProbe:
          httpGet:
            path: /robots.txt
            port: http
          periodSeconds: 20
          timeoutSeconds: 5
          failureThreshold: 3
        imagePullPolicy: IfNotPresent
      restartPolicy: Always
      dnsPolicy: ClusterFirst
