# Настройки PostgreSQL. Другие сервисы не подключают этот ConfigMap.
apiVersion: v1
kind: ConfigMap
metadata:
  name: notes-db-config
  namespace: notes
  labels:
    app.kubernetes.io/part-of: notes
data:
  POSTGRES_DB: "notes"
  PGDATABASE: "notes"      # libpq/pg_isready использует это имя без аргументов в Deployment
  PGDATA: "/var/lib/postgresql/data/pgdata"
---
# Учётные данные PostgreSQL.
apiVersion: v1
kind: Secret
metadata:
  name: notes-db-secret
  namespace: notes
  labels:
    app.kubernetes.io/part-of: notes
type: Opaque
stringData:
  POSTGRES_USER: "notes"
  POSTGRES_PASSWORD: "notes-lab4-password"
  PGUSER: "notes"
---
# Конфигурация приложения и его init-контейнера. Имена DB_* принадлежат приложению.
apiVersion: v1
kind: ConfigMap
metadata:
  name: notes-app-config
  namespace: notes
  labels:
    app.kubernetes.io/part-of: notes
data:
  STORAGE: "postgres"
  DB_HOST: "notes-db"
  DB_PORT: "5432"
  DB_NAME: "notes"
  MIGRATE_TIMEOUT: "180"
---
# Отдельный Secret приложения: оно не читает Secret контейнера PostgreSQL.
apiVersion: v1
kind: Secret
metadata:
  name: notes-app-secret
  namespace: notes
  labels:
    app.kubernetes.io/part-of: notes
type: Opaque
stringData:
  DB_USER: "notes"
  DB_PASSWORD: "notes-lab4-password"
