# Настройки, общие для базы и приложения. Те же имена переменных, что в .env из ЛР 2.
apiVersion: v1
kind: ConfigMap
metadata:
  name: notes-config
  namespace: notes
  labels:
    app.kubernetes.io/part-of: notes
data:
  POSTGRES_DB: "notes"
  STORAGE: "postgres"
  DB_HOST: "notes-db"          # имя Service базы
  DB_PORT: "5432"
  MIGRATE_TIMEOUT: "180"       # сколько init-контейнер ждёт базу
---
# Логин и пароль базы. Читают и Postgres, и приложение.
apiVersion: v1
kind: Secret
metadata:
  name: notes-db-secret
  namespace: notes
  labels:
    app.kubernetes.io/part-of: notes
type: Opaque
stringData:
  POSTGRES_USER: "notes"
  POSTGRES_PASSWORD: "notes-lab4-password"
