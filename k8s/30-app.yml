# Приложение: init-контейнер с миграцией, две реплики сервера и Service.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: notes-app
  namespace: notes
  labels:
    app.kubernetes.io/name: notes-app
    app.kubernetes.io/component: backend
    app.kubernetes.io/part-of: notes
    app.kubernetes.io/version: "2.0"
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: notes-app
  template:
    metadata:
      labels:
        app.kubernetes.io/name: notes-app
        app.kubernetes.io/component: backend
        app.kubernetes.io/part-of: notes
        app.kubernetes.io/version: "2.0"
    spec:
      # Образ из ЛР 1 работает под uid 10001, Kubernetes это проверяет.
      securityContext:
        runAsNonRoot: true
      # Аналог сервиса migrate из ЛР 2: тот же образ с командой migrate.
      # Основной контейнер стартует только после того, как init завершится с кодом 0.
      initContainers:
        - name: migrate
          image: notes-app:2.0
          imagePullPolicy: IfNotPresent
          args: ["migrate"]
          envFrom:
            - configMapRef:
                name: notes-config
            - secretRef:
                name: notes-db-secret
          resources:
            limits:
              cpu: 500m
              memory: 256Mi
      containers:
        - name: app
          image: notes-app:2.0       # собран из Dockerfile в корне репозитория
          imagePullPolicy: IfNotPresent
          args: ["serve"]
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: notes-config
            - secretRef:
                name: notes-db-secret
          # readiness: база доступна, можно слать запросы
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 2
          # liveness: процесс жив; от базы не зависит, чтобы её сбой не перезапускал приложение
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: notes-app
  namespace: notes
  labels:
    app.kubernetes.io/name: notes-app
    app.kubernetes.io/component: backend
    app.kubernetes.io/part-of: notes
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: notes-app
  ports:
    - name: http
      port: 80
      targetPort: http
