# ЛР 2. Разбор: docs/lab2-compose.md
# Значения переменных — в .env рядом с этим файлом.
name: notes

services:
  # База данных
  db:
    image: postgres:16.16-alpine
    container_name: notes-db
    env_file: .env
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      # $$ — чтобы переменные раскрыл shell в контейнере, а не Compose
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 120s      # первый запуск с initdb бывает долгим, неудачи в это время не считаются
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 256M
    networks:
      - notes-net

  # Одноразовый init: создаёт схему и завершается
  migrate:
    image: notes-app:2.0
    pull_policy: never        # образ собирает сервис app, тянуть его из реестра не нужно
    container_name: notes-migrate
    command: ["migrate"]
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    restart: "no"
    networks:
      - notes-net

  # Приложение
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: notes-app:2.0
    container_name: notes-app
    command: ["serve"]
    env_file: .env
    ports:
      - "${APP_PORT}:8080"
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/health/ready"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 15s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 384M
    networks:
      - notes-net

volumes:
  db-data:
    name: notes-db-data

networks:
  notes-net:
    name: notes-net
    driver: bridge
